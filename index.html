<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily XR GLSL VJ Loops</title>
    <meta
      name="description"
      content="XR/GLSLプロジェクト形式で、毎日ループするVJ素材と制作メモを公開するサイト。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage" aria-label="今日のVJループ">
        <canvas id="vj-canvas"></canvas>
        <div class="stage__shade"></div>
        <div class="topbar">
          <div>
            <p class="kicker">Daily XR / GLSL VJ Loop</p>
            <h1 id="piece-title">Loading</h1>
          </div>
          <div class="date-pill" id="piece-date"></div>
        </div>
        <div class="transport" aria-label="再生コントロール">
          <button class="icon-button" id="toggle-play" type="button" aria-label="一時停止">
            <span id="play-icon">II</span>
          </button>
          <button class="icon-button" id="toggle-motion" type="button" aria-label="動きを抑える">
            <span>~</span>
          </button>
          <button class="text-button" id="save-frame" type="button">PNG</button>
          <button class="text-button" id="save-video" type="button">MP4</button>
          <button class="text-button" id="copy-shader" type="button">GLSL</button>
          <button class="text-button" id="save-project" type="button">XR</button>
        </div>
      </section>

      <section class="detail-panel" aria-label="作品情報">
        <div class="summary">
          <p class="section-label">Today's Material</p>
          <h2 id="detail-title"></h2>
          <p id="detail-copy"></p>
        </div>

        <div class="meta-grid">
          <article>
            <p class="section-label">Loop</p>
            <strong id="loop-length"></strong>
            <span>seamless cycle</span>
          </article>
          <article>
            <p class="section-label">XR</p>
            <strong>WebGL ready</strong>
            <span>mirrors cleanly in headset views</span>
          </article>
          <article>
            <p class="section-label">Format</p>
            <strong>Fragment shader</strong>
            <span>date-seeded uniforms</span>
          </article>
        </div>

        <div class="tabs" role="tablist" aria-label="情報">
          <button class="tab is-active" data-tab="why" role="tab" type="button">Why</button>
          <button class="tab" data-tab="shader" role="tab" type="button">Shader</button>
          <button class="tab" data-tab="archive" role="tab" type="button">Archive</button>
        </div>

        <section class="tab-panel is-active" id="tab-why" role="tabpanel">
          <h3>検索メモと採用理由</h3>
          <p id="why-copy"></p>
          <ul class="source-list" id="source-list"></ul>
        </section>

        <section class="tab-panel" id="tab-shader" role="tabpanel">
          <h3>今日のGLSL</h3>
          <pre><code id="shader-code"></code></pre>
        </section>

        <section class="tab-panel" id="tab-archive" role="tabpanel">
          <h3>公開ログ</h3>
          <div class="archive-list" id="archive-list"></div>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
