<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luminous Seed Vessel / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030403;
        --ink: #f5f0e6;
        --muted: #a9a195;
        --gold: #ffbf68;
        --cyan: #8ee8ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(244, 144, 72, 0.18), transparent 34%),
          radial-gradient(circle at 50% 78%, rgba(42, 132, 132, 0.15), transparent 28%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.78);
      }

      h1 {
        margin: 0;
        font-size: clamp(19px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      p {
        margin: 8px 0 0;
        max-width: 590px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }

      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(245, 240, 230, 0.28);
        background: rgba(3, 4, 3, 0.46);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }

      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(245, 240, 230, 0.12);
      }

      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, var(--gold), var(--cyan), #f5f0e6);
        animation: loop-meter 22s linear infinite;
      }

      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--cyan);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }

      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }

      @media (max-width: 720px) {
        .hud {
          display: block;
        }

        a {
          display: inline-block;
          margin-top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Luminous Seed Vessel procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Luminous Seed Vessel</h1>
        <p>Organic Motion Objects / glowing seed-shell turntable / Blender + GLB + STL candidate</p>
      </div>
      <a href="../days/2026-08-10.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.10</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: "high-performance",
      });
      renderer.setClearColor(0x030403, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030403, 0.035);

      const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 90);
      camera.position.set(0, 1.28, 7.2);

      const loopSeconds = 22;
      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();

      const object = new THREE.Group();
      scene.add(object);

      const vessel = createSeedVessel();
      object.add(vessel);

      const glowShell = createSeedVessel({
        scale: 0.94,
        material: new THREE.MeshBasicMaterial({
          color: 0xff8f43,
          transparent: true,
          opacity: 0.18,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
        }),
      });
      object.add(glowShell);

      const veinGroup = new THREE.Group();
      object.add(veinGroup);
      const veinMaterial = new THREE.LineBasicMaterial({ color: 0xffd48b, transparent: true, opacity: 0.58 });
      for (let i = 0; i < 24; i += 1) {
        const geometry = new THREE.BufferGeometry();
        const points = [];
        const seed = i / 24;
        for (let step = 0; step <= 120; step += 1) {
          const v = 0.07 + (step / 120) * 0.86;
          const u = wrap01(seed + Math.sin(v * Math.PI * 4.0 + i * 0.73) * 0.026 + v * 0.07);
          points.push(seedPoint(u, v, 1.025).position);
        }
        geometry.setFromPoints(points);
        veinGroup.add(new THREE.Line(geometry, veinMaterial));
      }

      const podWindows = new THREE.Group();
      object.add(podWindows);
      const windowMaterial = new THREE.MeshBasicMaterial({
        color: 0x8ee8ff,
        transparent: true,
        opacity: 0.2,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const windowLineMaterial = new THREE.LineBasicMaterial({ color: 0xa9f1ff, transparent: true, opacity: 0.7 });
      for (let i = 0; i < 32; i += 1) {
        const u = wrap01(i * 0.61803398875 + 0.04 * Math.sin(i));
        const v = 0.13 + ((i * 0.271 + 0.03 * Math.cos(i * 1.7)) % 0.72);
        const w = 0.018 + 0.012 * (0.5 + 0.5 * Math.sin(i * 2.1));
        const h = 0.024 + 0.018 * (0.5 + 0.5 * Math.cos(i * 1.4));
        addSurfaceOval(podWindows, u, v, w, h, i * 0.57, windowMaterial, windowLineMaterial);
      }

      const floor = new THREE.GridHelper(7.5, 42, 0x72503a, 0x15140f);
      floor.position.y = -2.06;
      floor.material.transparent = true;
      floor.material.opacity = 0.2;
      scene.add(floor);

      const key = new THREE.DirectionalLight(0xffc07a, 4.0);
      key.position.set(-3.0, -2.4, 4.8);
      scene.add(key);

      const rim = new THREE.PointLight(0x8ee8ff, 5.6, 15);
      rim.position.set(3.1, 2.2, 2.8);
      scene.add(rim);

      const core = new THREE.PointLight(0xff8a39, 7.2, 9);
      core.position.set(0, 0.15, 0);
      scene.add(core);

      const fill = new THREE.HemisphereLight(0x84b6c2, 0x2d1a10, 1.25);
      scene.add(fill);

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });

      window.addEventListener("click", () => {
        object.rotation.y += Math.PI / 5;
      });

      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function createSeedVessel(options = {}) {
        const radialSegments = 192;
        const heightSegments = 118;
        const scale = options.scale || 1;
        const vertices = [];
        const normals = [];
        const uvs = [];
        const indices = [];

        for (let yIndex = 0; yIndex <= heightSegments; yIndex += 1) {
          const v = yIndex / heightSegments;
          for (let xIndex = 0; xIndex <= radialSegments; xIndex += 1) {
            const u = xIndex / radialSegments;
            const point = seedPoint(u, v, scale);
            vertices.push(point.position.x, point.position.y, point.position.z);
            normals.push(point.normal.x, point.normal.y, point.normal.z);
            uvs.push(u, v);
          }
        }

        for (let yIndex = 0; yIndex < heightSegments; yIndex += 1) {
          for (let xIndex = 0; xIndex < radialSegments; xIndex += 1) {
            const a = yIndex * (radialSegments + 1) + xIndex;
            const b = a + radialSegments + 1;
            indices.push(a, b, a + 1, b, b + 1, a + 1);
          }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setIndex(indices);
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
        geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geometry.computeVertexNormals();

        const material = options.material || new THREE.MeshPhysicalMaterial({
          color: 0xd9783d,
          roughness: 0.36,
          metalness: 0.02,
          clearcoat: 0.45,
          clearcoatRoughness: 0.48,
          side: THREE.DoubleSide,
          emissive: 0x2d0d04,
          emissiveIntensity: 0.14,
        });

        return new THREE.Mesh(geometry, material);
      }

      function seedPoint(u, v, scale) {
        const angle = u * Math.PI * 2;
        const profile = Math.sin(v * Math.PI);
        const y = -1.9 + v * 3.8;
        const belly = 0.42 + profile * 1.05;
        const shoulder = 0.26 * Math.exp(-Math.pow((v - 0.62) / 0.19, 2));
        const neck = -0.28 * Math.exp(-Math.pow((v - 0.94) / 0.08, 2));
        const tail = -0.18 * Math.exp(-Math.pow((v - 0.05) / 0.06, 2));
        const ribWave = Math.sin(angle * 9 + v * 8.0);
        const crease = Math.pow(0.5 + 0.5 * Math.sin(angle * 18 + v * 12.0), 4) * 0.09;
        const drift = Math.sin(angle * 3.0 - v * 6.0) * 0.065 + Math.cos(angle * 5.0 + v * 9.5) * 0.055;
        const radius = (belly + shoulder + neck + tail + (drift + crease + ribWave * 0.035) * profile) * scale;
        const position = new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius * 0.78);
        const normal = new THREE.Vector3(Math.cos(angle), 0.18, Math.sin(angle)).normalize();
        return { position, normal, angle };
      }

      function addSurfaceOval(group, u, v, width, height, twist, fillMaterial, lineMaterial) {
        const fill = new THREE.Mesh(new THREE.CircleGeometry(1, 38), fillMaterial);
        const center = seedPoint(u, v, 1.032);
        fill.position.copy(center.position);
        fill.lookAt(0, center.position.y * 0.3, 0);
        fill.rotateZ(twist * 0.2);
        fill.scale.set(width * 4.8, height * 5.8, 1);
        group.add(fill);

        const geometry = new THREE.BufferGeometry();
        const points = [];
        for (let i = 0; i <= 42; i += 1) {
          const t = (i / 42) * Math.PI * 2;
          const du = Math.cos(t) * width;
          const dv = Math.sin(t) * height;
          const pu = wrap01(u + du * Math.cos(twist) - dv * Math.sin(twist) * 0.42);
          const pv = clamp(v + du * Math.sin(twist) + dv * Math.cos(twist), 0.06, 0.94);
          points.push(seedPoint(pu, pv, 1.038).position);
        }
        geometry.setFromPoints(points);
        group.add(new THREE.Line(geometry, lineMaterial));
      }

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      function render() {
        const elapsed = clock.getElapsedTime();
        const cycle = (elapsed % loopSeconds) / loopSeconds;
        const phase = cycle * Math.PI * 2;

        pointer.lerp(targetPointer, 0.045);
        object.rotation.y = phase + pointer.x * 0.22;
        object.rotation.z = Math.sin(phase) * 0.035;
        object.scale.setScalar(1 + Math.sin(phase * 2) * 0.018);
        object.position.y = Math.sin(phase * 2) * 0.035;

        camera.position.x = Math.sin(phase) * 0.44 + pointer.x * 0.34;
        camera.position.y = 1.28 + pointer.y * 0.24;
        camera.position.z = 7.05 + Math.cos(phase) * 0.18;
        camera.lookAt(0, 0.02, 0);

        veinMaterial.opacity = 0.46 + 0.18 * (0.5 + 0.5 * Math.sin(phase * 3));
        windowMaterial.opacity = 0.14 + 0.09 * (0.5 + 0.5 * Math.sin(phase * 2));
        core.intensity = 6.4 + 2.2 * (0.5 + 0.5 * Math.sin(phase * 2));
        rim.position.x = Math.cos(phase) * 3.2;
        rim.position.z = Math.sin(phase) * 3.2;

        renderer.render(scene, camera);
      }

      function wrap01(value) {
        return ((value % 1) + 1) % 1;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }
    </script>
  </body>
</html>
