<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voronoi Light Shell / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #040404;
        --ink: #f4f0e8;
        --muted: #aaa59a;
        --warm: #ffb267;
        --blue: #77dbff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(122, 84, 46, 0.35), transparent 38%),
          #040404;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.78);
      }

      h1 {
        margin: 0;
        font-size: clamp(19px, 3.1vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      p {
        margin: 8px 0 0;
        max-width: 560px;
        color: var(--muted);
        font-size: clamp(12px, 1.35vw, 15px);
        line-height: 1.55;
      }

      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(244, 240, 232, 0.28);
        background: rgba(4, 4, 4, 0.46);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }

      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(244, 240, 232, 0.13);
      }

      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: #77dbff;
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
      }

      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, var(--warm), var(--blue), #f4f0e8);
        animation: loop-meter 20s linear infinite;
      }

      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }

      @media (max-width: 720px) {
        .hud {
          display: block;
        }

        a {
          display: inline-block;
          margin-top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Voronoi Light Shell procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Voronoi Light Shell</h1>
        <p>Blender Generative Lab / perforated shell study / lampshade + object pack candidate</p>
      </div>
      <a href="../days/2026-08-08.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">web rev 04 / final preview</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setClearColor(0x040404, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x040404, 0.045);

      const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 80);
      camera.position.set(0, 1.15, 7.1);

      const loopSeconds = 20;
      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();
      const shell = new THREE.Group();
      scene.add(shell);

      const cellWindows = createCellWindows();
      const outer = createShellMesh(false);
      const innerGlow = createShellMesh(true);
      shell.add(outer, innerGlow);

      const holes = new THREE.Group();
      shell.add(holes);
      const holeMaterial = new THREE.LineBasicMaterial({ color: 0x8fe5ff, transparent: true, opacity: 0.86 });
      const windowFillMaterial = new THREE.MeshBasicMaterial({
        color: 0xffd08a,
        transparent: true,
        opacity: 0.16,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      cellWindows.forEach((window, i) => {
        const curve = new THREE.BufferGeometry();
        const points = [];
        for (let index = 0; index <= 36; index += 1) {
          const t = (index / 36) * Math.PI * 2;
          const du = Math.cos(t) * window.w * (1 + 0.22 * Math.sin(t * 3 + i));
          const dv = Math.sin(t) * window.h;
          const u = wrap01(window.u + du * Math.cos(window.twist) - dv * Math.sin(window.twist) * 0.42);
          const v = clamp(window.v + du * Math.sin(window.twist) + dv * Math.cos(window.twist), 0.06, 0.94);
          points.push(shellPoint(u, v, 1.028).position);
        }
        curve.setFromPoints(points);
        holes.add(new THREE.Line(curve, holeMaterial));

        if (i % 3 !== 1) {
          const center = shellPoint(window.u, window.v, 1.032);
          const glow = new THREE.Mesh(new THREE.CircleGeometry(1, 40), windowFillMaterial);
          glow.position.copy(center.position);
          glow.lookAt(0, center.position.y * 0.35, 0);
          glow.rotateZ(window.twist * 0.2);
          glow.scale.set(window.w * 4.2, window.h * 5.2, 1);
          holes.add(glow);
        }
      });

      const latitudeLines = new THREE.Group();
      shell.add(latitudeLines);
      const latitudeMaterial = new THREE.LineBasicMaterial({ color: 0xffd69a, transparent: true, opacity: 0.22 });
      for (let band = 0; band < 10; band += 1) {
        const v = 0.11 + (band / 9) * 0.78;
        const geometry = new THREE.BufferGeometry();
        const points = [];
        for (let i = 0; i <= 220; i += 1) {
          const u = i / 220;
          points.push(shellPoint(u, v, 1.018).position);
        }
        geometry.setFromPoints(points);
        latitudeLines.add(new THREE.Line(geometry, latitudeMaterial));
      }

      const floor = new THREE.GridHelper(7, 36, 0x8a5f37, 0x27241f);
      floor.position.y = -1.95;
      floor.material.transparent = true;
      floor.material.opacity = 0.22;
      scene.add(floor);

      const warmCore = new THREE.PointLight(0xffa85f, 9.0, 9);
      warmCore.position.set(0, 0.1, 0);
      scene.add(warmCore);

      const key = new THREE.DirectionalLight(0xffc18a, 3.8);
      key.position.set(-2.8, -3.4, 4.6);
      scene.add(key);

      const rim = new THREE.PointLight(0x77dbff, 4.8, 14);
      rim.position.set(3.0, 2.6, 2.8);
      scene.add(rim);

      const fill = new THREE.HemisphereLight(0x9ccce0, 0x3b2418, 1.45);
      scene.add(fill);

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });

      window.addEventListener("click", () => {
        shell.rotation.y += Math.PI / 5;
      });

      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function createShellMesh(isGlow) {
        const radialSegments = 220;
        const heightSegments = 132;
        const vertices = [];
        const normals = [];
        const uvs = [];
        const indices = [];

        for (let yIndex = 0; yIndex <= heightSegments; yIndex += 1) {
          const v = yIndex / heightSegments;
          for (let xIndex = 0; xIndex <= radialSegments; xIndex += 1) {
            const u = xIndex / radialSegments;
            const point = shellPoint(u, v, isGlow ? 0.94 : 1.0);
            vertices.push(point.position.x, point.position.y, point.position.z);
            normals.push(point.normal.x, point.normal.y, point.normal.z);
            uvs.push(u, v);
          }
        }

        for (let yIndex = 0; yIndex < heightSegments; yIndex += 1) {
          for (let xIndex = 0; xIndex < radialSegments; xIndex += 1) {
            const a = yIndex * (radialSegments + 1) + xIndex;
            const b = a + radialSegments + 1;
            indices.push(a, b, a + 1, b, b + 1, a + 1);
          }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setIndex(indices);
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
        geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geometry.computeVertexNormals();

        const material = isGlow
          ? new THREE.MeshBasicMaterial({ color: 0xffa15a, transparent: true, opacity: 0.16, side: THREE.BackSide })
          : new THREE.MeshPhysicalMaterial({
              color: 0xf0a05c,
              roughness: 0.4,
              metalness: 0.02,
              clearcoat: 0.42,
              clearcoatRoughness: 0.46,
              transparent: false,
              opacity: 1.0,
              side: THREE.DoubleSide,
              emissive: 0x3a1305,
              emissiveIntensity: 0.24,
            });

        return new THREE.Mesh(geometry, material);
      }

      function shellPoint(u, v, scale) {
        const angle = u * Math.PI * 2;
        const profile = Math.sin(v * Math.PI);
        const y = -1.75 + v * 3.55;
        const dome = 0.38 + profile * 0.96;
        const shoulder = 0.36 * Math.exp(-Math.pow((v - 0.62) / 0.18, 2));
        const crownTaper = -0.23 * Math.exp(-Math.pow((v - 0.96) / 0.07, 2));
        const footTaper = -0.13 * Math.exp(-Math.pow((v - 0.04) / 0.06, 2));
        const macro = Math.sin(angle * 4 + v * 9) * 0.096;
        const micro = Math.cos(angle * 7 - v * 13) * 0.07;
        const cellular = Math.sin(angle * 11 + Math.sin(v * 11) * 2) * 0.064;
        const rib = Math.pow(0.5 + 0.5 * Math.sin(angle * 16 + v * 6), 4) * 0.105;
        const radius = (dome + shoulder + crownTaper + footTaper + (macro + micro + cellular + rib) * profile) * scale;
        const position = new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius * 0.82);
        const normal = new THREE.Vector3(Math.cos(angle), 0.2, Math.sin(angle)).normalize();
        return { position, normal, angle };
      }

      function createCellWindows() {
        const windows = [];
        for (let i = 0; i < 34; i += 1) {
          windows.push({
            u: wrap01(i * 0.61803398875 + 0.08 * Math.sin(i * 2.17)),
            v: 0.13 + ((i * 0.379 + 0.04 * Math.cos(i * 1.31)) % 0.72),
            w: 0.018 + 0.013 * (0.5 + 0.5 * Math.sin(i * 1.83)),
            h: 0.017 + 0.015 * (0.5 + 0.5 * Math.cos(i * 2.21)),
            twist: i * 0.73,
          });
        }
        return windows;
      }

      function isInsideCellWindow(u, v) {
        for (const window of cellWindows) {
          const du = wrappedDelta(u, window.u);
          const dv = v - window.v;
          const twist = -window.twist;
          const localU = du * Math.cos(twist) - dv * Math.sin(twist) * 0.42;
          const localV = du * Math.sin(twist) + dv * Math.cos(twist);
          const wobble = 1 + 0.18 * Math.sin((u + v) * Math.PI * 16);
          if ((localU / (window.w * wobble)) ** 2 + (localV / window.h) ** 2 < 1) return true;
        }
        return false;
      }

      function wrappedDelta(a, b) {
        let delta = a - b;
        if (delta > 0.5) delta -= 1;
        if (delta < -0.5) delta += 1;
        return delta;
      }

      function wrap01(value) {
        return ((value % 1) + 1) % 1;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      function render() {
        const elapsed = clock.getElapsedTime();
        const cycle = (elapsed % loopSeconds) / loopSeconds;
        const phase = cycle * Math.PI * 2;

        pointer.lerp(targetPointer, 0.045);
        shell.rotation.y = phase + pointer.x * 0.24;
        shell.rotation.z = Math.sin(phase) * 0.035;
        shell.position.y = Math.sin(phase * 2) * 0.035;
        holes.rotation.y = -phase * 0.18;

        camera.position.x = Math.sin(phase) * 0.46 + pointer.x * 0.34;
        camera.position.y = 1.15 + pointer.y * 0.28;
        camera.position.z = 6.95 + Math.cos(phase) * 0.2;
        camera.lookAt(0, 0.08, 0);

        warmCore.intensity = 7.2 + 2.6 * (0.5 + 0.5 * Math.sin(phase * 2));
        rim.position.x = Math.cos(phase) * 3.2;
        rim.position.z = Math.sin(phase) * 3.2;

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
